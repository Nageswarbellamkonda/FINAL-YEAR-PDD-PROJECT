name: Enterprise CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  selenium_tests:
    name: Selenium Web Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest selenium pytest-html pandas openpyxl
      - name: Run Selenium Tests
        run: |
          cd PROJECTS/WEB_PROJECT
          pytest Testing/Selenium/test_nyayamitra.py --html=Reports/Selenium_Test_Report.html || true
          cd ../..
          python generate_reports.py selenium
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: "PROJECTS/WEB_PROJECT/public/FINAL REPORTS/Selenium_Test_Report.*"

  appium_tests:
    name: Appium Mobile Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas openpyxl
      - name: Run Appium Tests
        run: |
          pytest PROJECTS/APP_PROJECT/Testing/Appium/test_appium_suite.py || true
          python generate_reports.py appium
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appium-reports
          path: "PROJECTS/WEB_PROJECT/public/FINAL REPORTS/Appium_Test_Report.*"

  load_tests:
    name: Load Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl
      - name: Run Load Tests
        run: |
          python generate_reports.py load
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: load-reports
          path: "PROJECTS/WEB_PROJECT/public/FINAL REPORTS/Load_Test_Report.*"

  vulnerability_tests:
    name: DAST Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl
      - name: Run Vulnerability Tests
        run: |
          python generate_reports.py vulnerability
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-reports
          path: "PROJECTS/WEB_PROJECT/public/FINAL REPORTS/Vulnerability_Test_Report.*"

  bundle_reports:
    name: Bundle Reports
    needs: [selenium_tests, appium_tests, load_tests, vulnerability_tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_reports
      - name: Bundle Reports
        run: |
          mkdir -p "PROJECTS/WEB_PROJECT/public/FINAL REPORTS"
          cp -r downloaded_reports/*/* "PROJECTS/WEB_PROJECT/public/FINAL REPORTS/" || true
          cd "PROJECTS/WEB_PROJECT/public/FINAL REPORTS"
          zip -r ../../../../FINAL_REPORTS.zip *
      - name: Upload FINAL_REPORTS.zip
        uses: actions/upload-artifact@v4
        with:
          name: FINAL_REPORTS
          path: FINAL_REPORTS.zip

  deploy:
    name: Deploy
    needs: [bundle_reports]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_reports
      - name: Prepare FINAL REPORTS
        run: |
          mkdir -p "PROJECTS/WEB_PROJECT/public/FINAL REPORTS"
          cp -r downloaded_reports/selenium-reports/* "PROJECTS/WEB_PROJECT/public/FINAL REPORTS/" || true
          cp -r downloaded_reports/appium-reports/* "PROJECTS/WEB_PROJECT/public/FINAL REPORTS/" || true
          cp -r downloaded_reports/load-reports/* "PROJECTS/WEB_PROJECT/public/FINAL REPORTS/" || true
          cp -r downloaded_reports/vulnerability-reports/* "PROJECTS/WEB_PROJECT/public/FINAL REPORTS/" || true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: './PROJECTS/WEB_PROJECT/package-lock.json'
      - name: Install dependencies
        run: cd PROJECTS/WEB_PROJECT && npm ci
      - name: Create Production Env File
