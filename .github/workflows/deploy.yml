          echo "VITE_SUPABASE_URL=https://bbznxozzucrhpppicjpg.supabase.co" > .env.production
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJiem54b3p6dWNyaHBwcGljanBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMDg1MzAsImV4cCI6MjA5OTg4NDUzMH0.ypnRyHKiT9a1zR_ZTVqPU0izrpmMmN-L7iKe2gneEqQ" >> .env.production
          echo "VITE_GEMINI_API_KEY=AIzaSyCmhDGvaBUQuFCvaDWt037KIgAPZj73Q70" >> .env.production
          echo "VITE_AI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai" >> .env.production
